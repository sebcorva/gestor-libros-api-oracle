spring.application.name=gestor-biblioteca

# Si existe un archivo .env en la raiz del proyecto, Spring lo lee como .properties (solo uso local).
spring.config.import=optional:file:.env[.properties]

# Conexion a Oracle Autonomous DB. Los valores vienen de variables de entorno.
# TNS_ADMIN: carpeta del wallet (tnsnames.ora, cwallet.sso, etc.)
spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_ALIAS:q5x4fu7bstfvswj5_high}?TNS_ADMIN=${TNS_ADMIN}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Origenes permitidos por CORS (frontend Angular con ng serve). Varios se separan con coma.
app.cors.allowed-origins=http://localhost:4200
