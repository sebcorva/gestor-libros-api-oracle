# Perfil "test": se activa con @ActiveProfiles("test").
# Reemplaza Oracle por H2 en memoria para que los tests no necesiten wallet ni credenciales (CI).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Crea las tablas al iniciar y las borra al terminar
spring.jpa.hibernate.ddl-auto=create-drop
